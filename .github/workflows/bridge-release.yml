name: Bridge release

# Builds the Electron-wrapped bridge (SA-90) for Mac and Windows and
# publishes both installers as assets on a GitHub Release. Triggered by
# pushing a `bridge-v*` tag — see bridge/README.md for the release process.
# Unsigned installers (SA-91): code signing is a separate follow-up story.
on:
  push:
    tags:
      - "bridge-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS installer
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v7
        with:
          name: bridge-mac
          path: bridge/release/*.dmg
          if-no-files-found: error

  build-win:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: bridge-win
          path: bridge/release/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/bridge-mac/*.dmg \
            artifacts/bridge-win/*.exe \
            --repo "${{ github.repository }}" \
            --title "Bridge ${{ github.ref_name }}" \
            --generate-notes
