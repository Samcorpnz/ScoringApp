# ─── SonarQube Community Edition — local static analysis ──────────────────
#
# Separate from docker-compose.yml on purpose: this is a dev-tooling stack,
# not part of the app (bridge → relay → frontend). Run it alongside or on
# its own.
#
# Before first run, on Linux hosts (and some Docker Desktop VMs) Elasticsearch
# inside SonarQube needs a higher mmap limit or it will crash-loop on startup:
#   sudo sysctl -w vm.max_map_count=262144
# (macOS Docker Desktop's default VM usually already satisfies this — if the
# sonarqube container keeps restarting, check `docker compose -f
# docker-compose.sonarqube.yml logs sonarqube` for the "max virtual memory
# areas" error and apply the sysctl inside the Docker Desktop VM.)
#
# Usage:
#   docker compose -f docker-compose.sonarqube.yml up -d
#   open http://localhost:9000        (default login: admin / admin, forced
#                                       password change on first login)
#
# Stop with `docker compose -f docker-compose.sonarqube.yml down` (add `-v`
# to also wipe the volumes below and start clean).
# ──────────────────────────────────────────────────────────────────────────

services:
  sonarqube-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 5s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:community
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Single-node local instance — skip the ES bootstrap checks that assume
      # a production-sized host (open file limits, bootstrap.memory_lock).
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc:
        soft: 8192
        hard: 8192

volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
